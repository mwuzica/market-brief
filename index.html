/* ══════════════════════════════════════════════════════════════

const R2J='https://api.rss2json.com/v1/api.json?rss_url=';
const PX='https://api.allorigins.win/raw?url=';

function strip(h){const d=document.createElement('div');d.innerHTML=h||'';return d.textContent||d.innerText||''}
function getSrc(t){const m=t.match(/\s-\s([^-]+)$/);return m?m[1].trim():''}
function cleanT(t){return t.replace(/\s-\s[^-]+$/,'').trim()}
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}
function timeAgo(d){const s=Math.floor((Date.now()-d)/1000);if(isNaN(s)||s<0)return 'baru saja';if(s<60)return 'baru saja';if(s<3600)return`${Math.floor(s/60)}m lalu`;if(s<86400)return`${Math.floor(s/3600)}j lalu`;if(s<604800)return`${Math.floor(s/86400)}h lalu`;return d.toLocaleDateString('id-ID',{day:'numeric',month:'short'})}

// Robust date parser — handles:
// 1) rss2json format: "2025-06-09 07:00:00" (no timezone, treat as UTC)
// 2) RSS pubDate: "Mon, 09 Jun 2025 14:00:00 +0700"
// 3) ISO 8601: "2025-06-09T07:00:00Z"
function parseDate(raw){
  if(!raw)return new Date(0);
  const s=raw.trim();
  // rss2json returns "YYYY-MM-DD HH:MM:SS" without timezone — this IS UTC
  if(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(s)){
    return new Date(s.replace(' ','T')+'Z');
  }
  // Standard parse for everything else (RSS dates with timezone, ISO, etc)
  const d=new Date(s);
  if(!isNaN(d.getTime()))return d;
  return new Date(0);
}

function cleanDesc(raw){
  let t=strip(raw).trim();
  t=t.replace(/Baca selengkapnya.*/i,'').replace(/Simak selengkapnya.*/i,'').replace(/Selengkapnya.*/i,'');
  t=t.replace(/\s*\[…\]\s*/g,'...').replace(/\s*…\s*$/g,'...').replace(/^[\s\n]+/,'');
  if(t.split('\n').length>3&&t.length<100)return '';
  return t;
}

const fc=new Map();

async function fetchDF(key){
  if(fc.has(key))return fc.get(key);
  const f=DF[key]; if(!f)return [];
  let items=[];
  try{
    const r=await fetch(R2J+encodeURIComponent(f.u),{signal:AbortSignal.timeout(12000)});
    if(r.ok){const d=await r.json();if(d.status==='ok'&&d.items)items=d.items.map(i=>({title:(i.title||'').trim(),link:i.link||'',description:cleanDesc(i.description||i.content||''),pubDate:parseDate(i.pubDate),source:f.n}));}
  }catch{}
  if(!items.length){
    try{const r2=await fetch(PX+encodeURIComponent(f.u),{signal:AbortSignal.timeout(12000)});if(r2.ok)items=parseXml(await r2.text(),f.n);}catch{}
  }
  fc.set(key,items);return items;
}

function parseXml(xml,sn){
  try{
    const doc=new DOMParser().parseFromString(xml,'text/xml');const items=[];
    doc.querySelectorAll('item').forEach(el=>{items.push({title:(el.querySelector('title')?.textContent||'').trim(),link:(el.querySelector('link')?.textContent||'').trim(),description:cleanDesc(el.querySelector('description')?.textContent||''),pubDate:parseDate(el.querySelector('pubDate')?.textContent||''),source:sn||''});});
    doc.querySelectorAll('entry').forEach(el=>{const lk=el.querySelector('link[rel="alternate"]')||el.querySelector('link');items.push({title:(el.querySelector('title')?.textContent||'').trim(),link:lk?.getAttribute('href')||'',description:cleanDesc(el.querySelector('summary')?.textContent||el.querySelector('content')?.textContent||''),pubDate:parseDate(el.querySelector('published')?.textContent||el.querySelector('updated')?.textContent||''),source:sn||''});});
    return items;
  }catch{return [];}
}

async function fetchGN(q){
  const u=`https://news.google.com/rss/search?q=${encodeURIComponent(q+' '+GN_SITES)}&hl=id&gl=ID&ceid=ID:id`;
  try{
    const r=await fetch(R2J+encodeURIComponent(u),{signal:AbortSignal.timeout(12000)});
    if(!r.ok)throw 0;const d=await r.json();
    if(d.status!=='ok'||!d.items)return [];
    return d.items.map(i=>({title:cleanT(i.title||''),link:i.link||'',description:'',pubDate:parseDate(i.pubDate),source:getSrc(i.title||'')}));
  }catch{
    try{const r2=await fetch(PX+encodeURIComponent(u),{signal:AbortSignal.timeout(12000)});if(!r2.ok)throw 0;return parseXml(await r2.text(),'').map(i=>({...i,title:cleanT(i.title),source:getSrc(i.title),description:''}));}catch{return [];}
  }
}

/* ══════════════════════════════════════════════════════════════
   FILTER
   ══════════════════════════════════════════════════════════════ */
function ok(a,col){
  const title=a.title.toLowerCase();
  const full=(a.title+' '+a.description).toLowerCase();

  // Hard excludes
  for(const x of GX)if(full.includes(x))return false;
  for(const x of col.no)if(full.includes(x.toLowerCase()))return false;

  // Word-boundary aware matcher — prevents "ore" matching "store",
  // "gas" matching "tugas", "uu " matching random text, etc.
  function hits(kw,text){
    const k=kw.toLowerCase();
    // Multi-word phrases: plain substring is fine (specific enough)
    if(k.includes(' '))return text.includes(k);
    // Single short/ambiguous word: require word boundaries
    const re=new RegExp('(^|[^a-z0-9])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z0-9]|$)','i');
    return re.test(text);
  }

  // Count matches, weighting title hits higher
  let titleScore=0, bodyScore=0;
  for(const kw of col.must){
    if(hits(kw,title))titleScore++;
    else if(hits(kw,full))bodyScore++;
  }

  // Decision: relevant if there's a clear signal
  //  - at least 1 keyword in the TITLE (strong signal), OR
  //  - at least 2 keywords anywhere (corroborating signals)
  if(titleScore>=1)return true;
  if(bodyScore>=2)return true;
  return false;
}
function gt(a,col){const t=(a.title+' '+a.description).toLowerCase();return col.tags.filter(k=>t.includes(k.toLowerCase())).slice(0,3)}

/* ══════════════════════════════════════════════════════════════
   UI
   ══════════════════════════════════════════════════════════════ */
function buildDeck(){
  const dk=document.getElementById('deck');dk.innerHTML='';
  COLS.forEach(c=>{const el=document.createElement('div');el.className='col';el.dataset.a=c.accent;el.innerHTML=`<div class="col-h"><div class="col-i">${c.icon}</div><div class="col-t">${c.title}</div><div class="col-n" id="n-${c.id}">—</div></div><div class="feed" id="f-${c.id}"><div class="ls"><div class="spinner"></div><span>Memuat berita...</span></div></div>`;dk.appendChild(el);});
}

function render(cid,arts,err){
  const f=document.getElementById(`f-${cid}`),n=document.getElementById(`n-${cid}`),col=COLS.find(c=>c.id===cid);
  if(err){f.innerHTML=`<div class="ers"><span style="font-size:20px">⚠️</span><span>Gagal memuat</span><button class="rbtn" onclick="loadCol('${cid}')">Coba lagi</button></div>`;n.textContent='!';return;}
  const seen=new Set();
  const uni=arts.filter(a=>a.title&&a.title.length>15).sort((a,b)=>{const ta=a.pubDate.getTime(),tb=b.pubDate.getTime();if(isNaN(ta)&&isNaN(tb))return 0;if(isNaN(ta))return 1;if(isNaN(tb))return -1;return tb-ta}).filter(a=>{const k=a.title.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,50);if(seen.has(k))return false;seen.add(k);return true}).slice(0,35);
  if(!uni.length){f.innerHTML=`<div class="es"><span style="font-size:20px">📭</span><span>Belum ada berita</span><button class="rbtn" onclick="loadCol('${cid}')">Coba lagi</button></div>`;n.textContent='0';return;}
  n.textContent=uni.length;f.innerHTML='';
  uni.forEach((a,i)=>{
    const tg=gt(a,col),c=document.createElement('a');
    c.className='card card-new';c.href=a.link;c.target='_blank';c.rel='noopener noreferrer';c.style.animationDelay=`${i*30}ms`;
    c.innerHTML=`<div class="card-s"><span class="card-sn">${esc(a.source)}</span><span class="card-tm">${timeAgo(a.pubDate)}</span></div><div class="card-tt">${esc(a.title)}</div>${a.description?`<div class="card-desc">${esc(a.description)}</div>`:''}${tg.length?`<div class="card-tg">${tg.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`:''}`;
    f.appendChild(c);
  });
}

async function loadCol(cid){
  const col=COLS.find(c=>c.id===cid);if(!col)return;
  document.getElementById(`f-${cid}`).innerHTML=`<div class="ls"><div class="spinner"></div><span>Memuat berita...</span></div>`;
  const all=[];let any=false;

  // 1) Fetch direct RSS feeds (these have real summaries)
  const dfRes=await Promise.allSettled(col.feeds.map(k=>fetchDF(k)));
  dfRes.forEach(r=>{if(r.status==='fulfilled'&&r.value?.length){all.push(...r.value);any=true;}});

  // 2) Fetch Google News RSS for Bloomberg Technoz + Kompas (no summary, but titles)
  if(col.gn?.length){
    const gnRes=await Promise.allSettled(col.gn.map(q=>fetchGN(q)));
    gnRes.forEach(r=>{if(r.status==='fulfilled'&&r.value?.length){all.push(...r.value);any=true;}});
  }

  const filtered=all.filter(a=>ok(a,col));
  render(cid,filtered,!any&&!filtered.length);
}

let busy=false,timer=null;
async function refreshAll(){
  if(busy)return;busy=true;
  const b=document.getElementById('rbtn'),d=document.getElementById('dot');
  b.classList.add('ld');d.style.background='#eab308';
  fc.clear();

  // 1) Fetch all feeds and Google News for all columns in parallel
  const colArticles={}; // colId -> raw articles
  await Promise.allSettled(COLS.map(async col=>{
    const all=[];let any=false;
    const dfRes=await Promise.allSettled(col.feeds.map(k=>fetchDF(k)));
    dfRes.forEach(r=>{if(r.status==='fulfilled'&&r.value?.length){all.push(...r.value);any=true;}});
    if(col.gn?.length){
      const gnRes=await Promise.allSettled(col.gn.map(q=>fetchGN(q)));
      gnRes.forEach(r=>{if(r.status==='fulfilled'&&r.value?.length){all.push(...r.value);any=true;}});
    }
    colArticles[col.id]={arts:all.filter(a=>ok(a,col)),any};
  }));

  // 2) Cross-column dedup: each article goes to the column where it has the most keyword matches
  const globalClaimed=new Set(); // title keys already assigned to a column

  // Score an article against a column — title matches weighted higher
  function score(a,col){
    const title=a.title.toLowerCase();
    const full=(a.title+' '+a.description).toLowerCase();
    function hits(kw,text){
      const k=kw.toLowerCase();
      if(k.includes(' '))return text.includes(k);
      const re=new RegExp('(^|[^a-z0-9])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z0-9]|$)','i');
      return re.test(text);
    }
    let s=0;
    for(const k of col.must){
      if(hits(k,title))s+=2;       // title match worth double
      else if(hits(k,full))s+=1;
    }
    return s;
  }

  // Build a map: titleKey -> {colId, score} for best column
  const bestCol={}; // titleKey -> colId with highest score
  for(const col of COLS){
    const arts=colArticles[col.id]?.arts||[];
    for(const a of arts){
      const key=a.title.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,50);
      const s=score(a,col);
      if(!bestCol[key]||s>bestCol[key].s){
        bestCol[key]={cid:col.id,s};
      }
    }
  }

  // 3) Render each column with only articles that belong to it
  for(const col of COLS){
    const data=colArticles[col.id];
    if(!data){render(col.id,[],true);continue;}
    const owned=data.arts.filter(a=>{
      const key=a.title.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,50);
      return bestCol[key]?.cid===col.id;
    });
    render(col.id,owned,!data.any&&!owned.length);
  }

  const now=new Date();
  document.getElementById('upd').textContent=`Update: ${now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;
  d.style.background='#22c55e';b.classList.remove('ld');busy=false;
  showToast(`✅ Updated ${now.toLocaleTimeString('id-ID')}`);
}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
function setTimer(){if(timer)clearInterval(timer);timer=setInterval(refreshAll,parseInt(document.getElementById('iv').value))}
document.getElementById('iv').addEventListener('change',setTimer);
buildDeck();refreshAll();setTimer();
</script>
